<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http://localhost:8080 https://localhost:8080; script-src 'self' 'unsafe-inline' http://localhost:8080; style-src 'self' 'unsafe-inline' http://localhost:8080; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 https://localhost:8080 ws://localhost:8080 wss://localhost:8080">
    <title>OIer-Helper 桌面版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .mode-tab {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }
        .mode-tab:hover { border-color: #667eea; background: #f5f3ff; }
        .mode-tab.active { border-color: #667eea; background: #667eea; color: white; }
        .mode-tab .icon { font-size: 24px; display: block; margin-bottom: 5px; }
        .input-section { margin-bottom: 20px; }
        .input-section label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; }
        .input-section textarea,
        .input-section input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
        }
        .input-section textarea:focus,
        .input-section input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        .input-section textarea { min-height: 120px; resize: vertical; }
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .result-section {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .result-section.show { display: block; }
        .result-content { color: #333; line-height: 1.8; white-space: pre-wrap; }
        footer { text-align: center; color: white; opacity: 0.8; margin-top: 30px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 OIer-Helper</h1>
            <p>算法学习助手 - 桌面版</p>
        </div>
        <div class="card">
            <div class="mode-tabs">
                <div class="mode-tab active"><span class="icon">📝</span>题目解析</div>
                <div class="mode-tab"><span class="icon">📚</span>算法讲解</div>
                <div class="mode-tab"><span class="icon">🔍</span>代码Debug</div>
                <div class="mode-tab"><span class="icon">✏️</span>练习题</div>
                <div class="mode-tab"><span class="icon">📒</span>笔记整理</div>
            </div>
            <div class="input-section">
                <label>请输入内容：</label>
                <input type="text" placeholder="输入题目链接、算法名称或代码...">
            </div>
            <button class="btn-primary">开始分析</button>
            <div class="result-section">
                <div class="result-content" id="result"></div>
            </div>
        </div>
        <footer>
            <p>OIer-Helper Desktop v1.0 | 仅供学习参考</p>
        </footer>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
